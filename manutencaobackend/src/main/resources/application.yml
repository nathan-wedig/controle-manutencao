server:
  port: 8087

spring:
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:h2:file:./data/manutencao;AUTO_SERVER=TRUE}
    username: ${APP_DATASOURCE_USERNAME:sa}
    password: ${APP_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: ${APP_H2_CONSOLE_ENABLED:false}
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: ${APP_JPA_DDL_AUTO:update}
    show-sql: ${APP_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:em-demonstracao-troque-esta-chave-por-uma-variaveis-de-ambiente-segura-longa-256-bits}
    expiration: ${JWT_EXPIRATION:86400000}

  upload:
    dir: ${APP_UPLOAD_DIR:manutencaoanexos}
